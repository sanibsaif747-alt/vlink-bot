services:
  - type: web
    name: vlink-bot
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python vlink_bypass.py
    envVars:
      - key: VPLINK_BOT_TOKEN
        sync: false
      - key: VPLINK_ALLOWED_CHAT_IDS
        sync: false